# Build + deploy a GitHub Pages, sitio 100% estático (ver ROADMAP-portfolio.md, "Hosting" y
# "Estado actual en disco"). Sin efecto hasta que exista el remoto `jsierram.github.io` y se
# habilite "Settings → Pages → Source: GitHub Actions" en el repo — este archivo queda listo
# de antemano, no depende de ningún paso previo para poder commitearse.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # `outputMode: "static"` en angular.json ya prerenderiza todo en dist/portfolio-app/browser
      # — no hace falta un paso de export/render aparte.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
