# Build + deploy a GitHub Pages, sitio 100% estático (ver ROADMAP-portfolio.md, "Hosting" y
# "Estado actual en disco"). Repo real: jsierram-dev/jsierram-dev.github.io (cuenta renombrada
# a "jsierram-dev" el 2026-08-08 antes de publicar). Sin efecto hasta habilitar "Settings →
# Pages → Source: GitHub Actions" en el repo.
name: Deploy to GitHub Pages

on:
  push:
    # master, no main: mismo nombre de rama por defecto que el resto de los repos del usuario
    # (similart-app, etc.) — ver el commit del push inicial para el porqué.
    branches: [master]
  # Rebuild semanal para refrescar la actividad de GitHub del sidebar (scripts/fetch-github-activity.mjs):
  # los datos se hornean en el build, así que sin esto la cifra se congela hasta el siguiente push.
  # Lunes 04:17 UTC (≈06:17 en España en verano). Minuto no redondo: GitHub retrasa los crons en punto.
  # Ojo: GitHub pausa los schedules tras 60 días sin commits en el repo; se reactiva con cualquier push.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # trae el heatmap de contribuciones real (github.com/users/<login>/contributions, público,
      # sin token) justo antes de buildear — ver scripts/fetch-github-activity.mjs. No falla el
      # deploy si GitHub no responde: ese script deja el JSON ya commiteado tal cual.
      - run: npm run fetch:github
      - run: npm run build
      # `outputMode: "static"` en angular.json ya prerenderiza todo en dist/portfolio-app/browser
      # — no hace falta un paso de export/render aparte.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
