<!-- selector de idioma, hijo directo de app-root (2026-08-08 en el mockup) — independiente
     del sidebar a propósito: el sidebar solo se muestra en la pestaña "about" en móvil, así
     que si el selector viviera adentro desaparecería en las otras 3 pestañas. Comparte
     [data-lang]-equivalente (aquí, un (click) directo a lang.setLang) con la copia de
     escritorio de más abajo — misma lógica, sin wiring genérico por atributo porque en
     Angular cada botón ya llama al método directo. -->
<div class="lang-switch lang-switch--mobile-bar mobile-only" role="group" aria-label="Language / Idioma">
  <button type="button" [class.active]="lang.currentLang() === 'en'" (click)="lang.setLang('en')" aria-label="English" title="English">
    <svg viewBox="0 0 24 16" width="20" height="14" aria-hidden="true">
      <rect width="24" height="16" fill="#012169"></rect>
      <path d="M0 0L24 16M24 0L0 16" stroke="#FFFFFF" stroke-width="3.2"></path>
      <path d="M0 0L24 16M24 0L0 16" stroke="#C8102E" stroke-width="1.1"></path>
      <rect x="9.5" width="5" height="16" fill="#FFFFFF"></rect>
      <rect y="6" width="24" height="4" fill="#FFFFFF"></rect>
      <rect x="10.6" width="2.8" height="16" fill="#C8102E"></rect>
      <rect y="6.9" width="24" height="2.2" fill="#C8102E"></rect>
    </svg>
  </button>
  <button type="button" [class.active]="lang.currentLang() === 'es'" (click)="lang.setLang('es')" aria-label="Español" title="Español">
    <svg viewBox="0 0 24 16" width="20" height="14" aria-hidden="true">
      <rect width="24" height="16" fill="#AA151B"></rect>
      <rect y="4" width="24" height="8" fill="#F1BF00"></rect>
    </svg>
  </button>
</div>

  <!-- las 4 quedan siempre en el DOM, [hidden] alterna cuál se ve -- con @switch cada
       panel se destruye y recrea al cambiar de pestaña, perdiendo su propio estado
       (filtros de Portfolio, "ver más" de Resume, detalle de proyecto abierto) cada vez
       que se vuelve a esa pestaña; en el mockup ese estado persistía porque todo vivía
       siempre en el mismo DOM, solo oculto -->
  <div class="panels">
    <app-about-panel [hidden]="nav.activeTab() !== 'about'" />
    <app-resume-panel [hidden]="nav.activeTab() !== 'resume'" />
    <app-portfolio-panel [hidden]="nav.activeTab() !== 'portfolio'" />
    <app-cv-panel [hidden]="nav.activeTab() !== 'cv'" />
  </div>
</section>
