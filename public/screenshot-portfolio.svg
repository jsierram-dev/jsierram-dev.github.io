<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-portfolio" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2332;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="300" fill="url(#grad-portfolio)"/>
  
  <!-- Code editor window -->
  <rect x="50" y="30" width="700" height="240" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
  
  <!-- Window chrome -->
  <rect x="50" y="30" width="700" height="30" fill="#0F172A"/>
  <circle cx="75" cy="45" r="6" fill="#FF6B6B"/>
  <circle cx="105" cy="45" r="6" fill="#FBBF24"/>
  <circle cx="135" cy="45" r="6" fill="#34D399"/>
  
  <!-- Code lines -->
  <rect x="70" y="80" width="220" height="16" fill="#60A5FA"/>
  <rect x="70" y="120" width="280" height="16" fill="#A78BFA"/>
  <rect x="70" y="160" width="250" height="16" fill="#34D399"/>
  <rect x="70" y="200" width="180" height="16" fill="#FBBF24"/>
  
  <!-- Terminal indicators -->
  <g fill="#10B981" stroke="none">
    <rect x="700" y="80" width="30" height="20"/>
    <rect x="700" y="120" width="30" height="20"/>
    <rect x="700" y="160" width="30" height="20"/>
    <rect x="700" y="200" width="30" height="20"/>
  </g>
</svg>
